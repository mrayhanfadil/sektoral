# Local Sektoral: `docker compose up --build`, then open http://localhost:8765
services:
  sectoral:
    build:
      context: .
      # Build from local base images only (see the ARGs in the Dockerfile);
      # rebuilds reuse the local layer cache and the npm/pip/apt cache mounts.
      pull: false
    image: sectoral:local
    ports:
      - "127.0.0.1:${SECTORAL_PORT:-8765}:8765"
    # LLM and Tavily keys (see .env.example); the app runs without the file,
    # but research runs need an LLM key.
    env_file:
      - path: .env
        required: false
    environment:
      # The app always listens on 8765 inside the container. SECTORAL_PORT in
      # .env picks only the host port above; env_file would otherwise hand it
      # to the server too, which then listens where nothing is mapped.
      SECTORAL_PORT: "8765"
      SECTORAL_PDF: "1"
      # Local default "open": anyone reaching the localhost-only port can start
      # a live run with the LLM key from .env. For a public deployment set
      # SECTORAL_LIVE_RUNS=token in .env, so only SECTORAL_RUN_TOKEN starts a
      # live (paid) run and other visitors replay stored runs.
      SECTORAL_LIVE_RUNS: "${SECTORAL_LIVE_RUNS:-open}"
    # Run as your user so caches and reports written to the mounts stay yours.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Sectors snapshot plus the caches runs write (plans, memory, news).
      - ./data:/app/data
      # Research runs (out/web) and the report gallery (out/reports).
      - ./out:/app/out
    restart: unless-stopped
