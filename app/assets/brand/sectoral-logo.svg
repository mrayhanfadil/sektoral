<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 36" fill="none" role="img" aria-label="Sectoral">
  <title>Sectoral</title>
  <!-- S in black rounded type -->
  <text x="2" y="27" font-family="Roboto, Arial, sans-serif" font-weight="700" font-size="26" fill="#000000" stroke="#000000" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">S</text>
  <!-- Letter 'E' as three horizontal bars (#0928B1, #1DCD9F, #3ED628) -->
  <g id="letter-e">
    <rect x="23" y="8" width="18" height="4.5" rx="2.25" fill="#0928B1" />
    <rect x="23" y="15.5" width="14" height="4.5" rx="2.25" fill="#1DCD9F" />
    <rect x="23" y="23" width="18" height="4.5" rx="2.25" fill="#3ED628" />
  </g>
  <!-- CTORAL in black rounded type -->
  <text x="47" y="27" font-family="Roboto, Arial, sans-serif" font-weight="700" font-size="26" fill="#000000" stroke="#000000" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round" letter-spacing="0.5">CTORAL</text>
</svg>
