<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sektoral</title>
    <meta name="description" content="Sektoral mengubah data Sectors dan rilis resmi emiten menjadi company update emiten BEI dengan metode valuasi yang dipilih gerbang framework dan batas bukti yang transparan." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FFFFFF'/%3E%3Crect x='6' y='7' width='20' height='4.5' rx='2.2' fill='%230928B1'/%3E%3Crect x='6' y='13.8' width='14' height='4.5' rx='2.2' fill='%231DCD9F'/%3E%3Crect x='6' y='20.5' width='20' height='4.5' rx='2.2' fill='%233ED628'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved or system theme before first paint (no flash).
      try {
        var pref = localStorage.getItem("sectoral-theme");
        var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
